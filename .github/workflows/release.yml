name: Release

on:
  release:
    types: [published]

env:
  APP_NAME: breezedark
  CERT_DIRECTORY: $HOME/.nextcloud/certificates

jobs:
  release:
    runs-on: ubuntu-latest
    name: Release new version
    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          path: ${{ env.APP_NAME }}

      - name: Run build
        if: ${{ secrets.APP_PRIVATE_KEY != '' }}
        run: |
          mkdir -p ${{ env.CERT_DIRECTORY }}
          echo "${{ secrets.APP_PRIVATE_KEY }}" > ${{ env.CERT_DIRECTORY }}/${{ env.APP_NAME }}.key
          echo "${{ secrets.APP_CERT }}" > ${{ env.CERT_DIRECTORY }}/${{ env.APP_NAME }}.crt
          cd ${{ env.APP_NAME }}
          make appstore || true
          rm -rf ${{ env.CERT_DIRECTORY }}

      - name: Upload app to Nextcloud appstore
        if: ${{ secrets.APPSTORE_TOKEN != '' && secrets.APP_PRIVATE_KEY != '' }}
        uses: R0Wi/nextcloud-appstore-push-action@v1
        with:
          app_name: ${{ env.APP_NAME }}
          appstore_token: ${{ secrets.APPSTORE_TOKEN }}
          download_url: ${{ steps.attach_to_release.outputs.browser_download_url }}
          app_private_key: ${{ secrets.APP_PRIVATE_KEY }}
